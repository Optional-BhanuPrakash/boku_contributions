name: games — arcade pack + snake (single output push)

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: generate arcade SVGs (6 games)
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: Optional-BhanuPrakash
          games: 'pacman,breakout,galaga,puzzle-bobble,bomberman,minesweeper'
          hide_month_labels: 'false'

      - name: generate snake (dark + light)
        uses: Platane/snk@v3
        with:
          github_user_name: Optional-BhanuPrakash
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?color_snake=#ff4fd8&color_dots=#1a1b27,#1f91cf,#6be8ff,#20ff24,#9cff9f

      - name: push all game SVGs to output branch (one push — no clobber)
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
